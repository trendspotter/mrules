<html>
  <head>
    <meta charset="utf-8" />
    <title>Maperitive Rules Studio</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --border: #cbd5e1;
        --muted: #64748b;
        --text: #0f172a;
        --accent: #2563eb;
        --accent-soft: #dbeafe;
        --success: #166534;
        --warning: #9a5b00;
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        --radius: 16px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(180deg, #eef4ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      #mrules-studio {
        max-width: 1500px;
        margin: 24px auto;
        background: rgba(255,255,255,0.7);
        border: 1px solid rgba(148,163,184,0.35);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 18px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 6px 6px 18px;
      }

      .title-wrap h1 {
        margin: 0;
        font-size: clamp(1.7rem, 2.5vw, 2.4rem);
        line-height: 1.1;
      }

      .title-wrap small {
        color: var(--muted);
        display: block;
        margin-top: 8px;
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s ease;
      }

      button:hover { transform: translateY(-1px); }

      button.primary {
        background: linear-gradient(180deg, #1d4ed8, #1e40af);
        border-color: #1e40af;
        color: #fff;
      }

      button.secondary {
        background: #f8fafc;
      }

      button.warn {
        background: #fff7ed;
        border-color: #fdba74;
        color: #9a5b00;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
        gap: 18px;
      }

      .panel {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--panel);
        min-height: 200px;
      }

      .settings {
        padding: 18px 16px 12px;
      }

      .section {
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #f8fafc;
        padding: 12px 12px 10px;
        margin-bottom: 14px;
      }

      .section h3 {
        margin: 0 0 10px;
        font-size: 1rem;
      }

      .field {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }

      .field label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 0.93rem;
      }

      .field .label-text {
        flex: 1;
      }

      input[type="text"],
      input[type="number"],
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }

      input[type="color"] {
        width: 52px;
        height: 36px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
      }

      input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }

      .short {
        width: 90px;
      }

      .compact {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .output-panel {
        padding: 14px;
        display: flex;
        flex-direction: column;
      }

      .tabbar {
        display: flex;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 12px;
      }

      .tab {
        background: transparent;
        border: 0;
        border-radius: 10px 10px 0 0;
        padding: 10px 12px 12px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }

      .tab.active {
        color: var(--text);
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .tab-panel {
        display: none;
        flex: 1;
      }

      .tab-panel.active {
        display: flex;
        flex-direction: column;
      }

      textarea {
        flex: 1;
        min-height: 620px;
        resize: vertical;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.5;
        background: #f8fafc;
        color: #0f172a;
      }

      .status {
        min-height: 24px;
        margin-top: 12px;
        color: var(--success);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .muted {
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
        textarea { min-height: 420px; }
      }
    </style>
  </head>
  <body>
    <div id="mrules-studio">
      <div class="topbar">
        <div class="title-wrap">
          <h1>Maperitive Rules Studio</h1>
          <small>Vizuální generátor a editace .mrules s podporou přímé úpravy textu</small>
        </div>
        <div class="actions">
          <button type="button" class="secondary" id="presetBtn">Nastavit předvolbu</button>
          <button type="button" class="primary" id="generateBtn">Generovat .mrules</button>
        </div>
      </div>

      <div class="layout">
        <aside class="panel settings">
          <div class="section">
            <h3>Obecné</h3>
            <div class="field">
              <label for="styleName" class="label-text">Název stylu</label>
              <input id="styleName" type="text" value="Krumlov Art Map" />
            </div>
            <div class="field">
              <label for="background" class="label-text">Pozadí mapy</label>
              <input id="background" type="color" value="#f4eedf" />
            </div>
            <div class="field">
              <label for="sea" class="label-text">Barva moře / vodního pozadí</label>
              <input id="sea" type="color" value="#b9d9df" />
            </div>
          </div>

          <div class="section">
            <h3>Vodstvo</h3>
            <div class="field">
              <label><input id="waterOn" type="checkbox" checked /> Zobrazit plochy vody</label>
              <input id="waterFill" type="color" value="#8fcbd4" />
            </div>
            <div class="field">
              <label><input id="wetlandOn" type="checkbox" checked /> Mokřady</label>
              <input id="wetlandFill" type="color" value="#9bc7c2" />
            </div>
            <div class="field">
              <label><input id="riverOn" type="checkbox" checked /> Řeky a potoky</label>
              <input id="riverColor" type="color" value="#3c91a3" />
            </div>
            <div class="field">
              <label for="riverWidth" class="label-text">Tloušťka řek</label>
              <input id="riverWidth" type="number" min="0.1" max="15" step="0.1" value="1.4" class="short" />
            </div>
            <div class="field">
              <label for="riverOpacity" class="label-text">Průhlednost řek</label>
              <input id="riverOpacity" type="number" min="0" max="1" step="0.05" value="0.95" class="short" />
            </div>
          </div>

          <div class="section">
            <h3>Krajina a plochy</h3>
            <div class="field">
              <label><input id="forestOn" type="checkbox" checked /> Lesy</label>
              <input id="forestFill" type="color" value="#9caf83" />
            </div>
            <div class="field">
              <label><input id="meadowOn" type="checkbox" checked /> Louky</label>
              <input id="meadowFill" type="color" value="#d8dba8" />
            </div>
            <div class="field">
              <label><input id="sandOn" type="checkbox" checked /> Písek, pláže</label>
              <input id="sandFill" type="color" value="#e7d4a2" />
            </div>
            <div class="field">
              <label><input id="buildingOn" type="checkbox" checked /> Budovy</label>
              <input id="buildingFill" type="color" value="#725d55" />
            </div>
            <div class="field">
              <label for="areaOpacity" class="label-text">Krytí ploch</label>
              <input id="areaOpacity" type="number" min="0" max="1" step="0.05" value="0.85" class="short" />
            </div>
          </div>

          <div class="section">
            <h3>Cesty a železnice</h3>
            <div class="field">
              <label><input id="majorOn" type="checkbox" checked /> Hlavní silnice</label>
              <input id="majorColor" type="color" value="#c96b45" />
            </div>
            <div class="field">
              <label for="majorWidth" class="label-text">Výška hlavních silnic</label>
              <input id="majorWidth" type="number" min="0.1" max="20" step="0.1" value="2.6" class="short" />
            </div>
            <div class="field">
              <label><input id="minorOn" type="checkbox" checked /> Vedlejší silnice</label>
              <input id="minorColor" type="color" value="#d8a477" />
            </div>
            <div class="field">
              <label><input id="pathOn" type="checkbox" checked /> Cesty a stezky</label>
              <input id="pathColor" type="color" value="#775a41" />
            </div>
            <div class="field">
              <label for="pathWidth" class="label-text">Tloušťka cest</label>
              <input id="pathWidth" type="number" min="0.1" max="10" step="0.1" value="0.8" class="short" />
            </div>
            <div class="field">
              <label><input id="railOn" type="checkbox" checked /> Železnice</label>
              <input id="railColor" type="color" value="#7b7f8a" />
            </div>
          </div>

          <div class="section">
            <h3>Popisky / text</h3>
            <div class="field">
              <label><input id="placeOn" type="checkbox" checked /> Názvy sídel</label>
              <input id="placeColor" type="color" value="#302821" />
            </div>
            <div class="field">
              <label for="fontName" class="label-text">Písmo</label>
              <input id="fontName" type="text" value="DejaVu Sans" />
            </div>
            <div class="field">
              <label for="fontSize" class="label-text">Velikost textu</label>
              <input id="fontSize" type="number" min="6" max="80" step="1" value="14" class="short" />
            </div>
            <div class="field">
              <label for="fontWeight" class="label-text">Tloušťka písma</label>
              <select id="fontWeight">
                <option value="normal">normální</option>
                <option value="bold" selected>tučné</option>
                <option value="italic">italic</option>
              </select>
            </div>
            <div class="field">
              <label for="labelOffset" class="label-text">Odsazení textu</label>
              <input id="labelOffset" type="number" min="-20" max="20" step="1" value="3" class="short" />
            </div>
            <div class="field">
              <label for="textHaloRadius" class="label-text">Ohraničení / halo</label>
              <input id="textHaloRadius" type="number" min="0" max="12" step="0.5" value="2" class="short" />
            </div>
            <div class="field">
              <label for="textHaloOpacity" class="label-text">Průhlednost halo</label>
              <input id="textHaloOpacity" type="number" min="0" max="1" step="0.05" value="0.9" class="short" />
            </div>
            <div class="field">
              <label for="textOpacity" class="label-text">Průhlednost textu</label>
              <input id="textOpacity" type="number" min="0" max="1" step="0.05" value="1" class="short" />
            </div>
            <div class="field">
              <label><input id="keepUpright" type="checkbox" checked /> Zachovat svislý text</label>
            </div>
            <div class="field">
              <label><input id="followPath" type="checkbox" checked /> Text sleduje linii</label>
            </div>
          </div>

          <div class="section">
            <h3>Pokročilé</h3>
            <div class="field">
              <label for="minZoom" class="label-text">Min. zoom</label>
              <input id="minZoom" type="number" min="0" max="20" step="1" value="0" class="short" />
            </div>
            <div class="field">
              <label for="maxZoom" class="label-text">Max. zoom</label>
              <input id="maxZoom" type="number" min="0" max="22" step="1" value="22" class="short" />
            </div>
            <div class="field">
              <label for="lineCap" class="label-text">Konec linie</label>
              <select id="lineCap">
                <option value="round" selected>round</option>
                <option value="butt">butt</option>
                <option value="square">square</option>
              </select>
            </div>
          </div>
        </aside>

        <main class="panel output-panel">
          <div class="tabbar">
            <button type="button" class="tab active" data-tab="generated">Vygenerované .mrules</button>
            <button type="button" class="tab" data-tab="manual">Přímá editace textu</button>
          </div>

          <div class="tab-panel active" id="panel-generated">
            <textarea id="output" spellcheck="false" aria-label="Výstup .mrules"></textarea>
          </div>

          <div class="tab-panel" id="panel-manual">
            <textarea id="manualText" spellcheck="false" aria-label="Přímá editace .mrules"></textarea>
          </div>

          <div class="actions" style="margin-top: 12px; justify-content: flex-start;">
            <button type="button" class="primary" id="generateFromGuiBtn">Generovat z GUI</button>
            <button type="button" class="secondary" id="applyManualBtn">Použít upravený text</button>
            <button type="button" class="secondary" id="copyBtn">Kopírovat</button>
            <button type="button" class="warn" id="downloadBtn">Stáhnout .mrules</button>
          </div>

          <div id="status" class="status" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script>
      (() => {
        const root = document.getElementById('mrules-studio');
        if (root.dataset.ready) return;
        root.dataset.ready = '1';

        const $ = (id) => root.querySelector('#' + id);
        const v = (id) => $(id) ? $(id).value : '';
        const checked = (id) => $(id) ? $(id).checked : false;
        const num = (id, fallback = 0) => {
          const val = parseFloat(v(id));
          return Number.isFinite(val) ? val : fallback;
        };

        function createRule(target, defs, draw) {
          return [
            'target : ' + target,
            ...defs.map((entry) => '\tdefine ' + entry),
            '\tdraw : ' + draw,
            ''
          ].join('\n');
        }

        function escapeComment(value) {
          return String(value || '').replace(/[\r\n]+/g, ' ');
        }

        function build() {
          const styleName = escapeComment(v('styleName'));
          const background = v('background');
          const sea = v('sea');
          const areaOpacity = num('areaOpacity', 0.85);
          const riverOpacity = num('riverOpacity', 0.95);

          const sections = [];
          const rules = [];

          sections.push('// Generated by Maperitive Rules Studio');
          sections.push('// Style: ' + styleName);
          sections.push('');
          sections.push('features');
          sections.push('\tareas');

          if (checked('waterOn')) {
            sections.push('\t\twater : natural=water OR waterway=riverbank OR landuse=reservoir');
          }
          if (checked('wetlandOn')) {
            sections.push('\t\twetland : natural=wetland OR landuse=wetland');
          }
          if (checked('forestOn')) {
            sections.push('\t\tforest : natural=wood OR landuse=forest');
          }
          if (checked('meadowOn')) {
            sections.push('\t\tmeadow : landuse=meadow OR natural=grassland OR natural=scrub');
          }
          if (checked('sandOn')) {
            sections.push('\t\tsand : natural=sand OR natural=beach');
          }
          if (checked('buildingOn')) {
            sections.push('\t\tbuilding : building');
          }

          sections.push('\tlines');
          if (checked('riverOn')) {
            sections.push('\t\triver : waterway=river OR waterway=stream OR waterway=canal');
          }
          if (checked('majorOn')) {
            sections.push('\t\tmajor_road : highway=motorway OR highway=trunk OR highway=primary OR highway=trunk_link');
          }
          if (checked('minorOn')) {
            sections.push('\t\tminor_road : highway=secondary OR highway=tertiary OR highway=residential OR highway=unclassified');
          }
          if (checked('pathOn')) {
            sections.push('\t\tpath : highway=footway OR highway=path OR highway=track OR highway=cycleway');
          }
          if (checked('railOn')) {
            sections.push('\t\trailway : railway=rail');
          }

          sections.push('\tpoints');
          if (checked('placeOn')) {
            sections.push('\t\tplace : place=city OR place=town OR place=village OR place=hamlet OR place=suburb');
          }
          sections.push('');
          sections.push('properties');
          sections.push('\tmap-background-color : ' + background);
          sections.push('\tmap-sea-color : ' + sea);
          sections.push('\tfont-family : ' + v('fontName'));
          sections.push('\tfont-size : ' + num('fontSize', 14));
          sections.push('');
          sections.push('rules');

          // water
          if (checked('waterOn')) {
            rules.push(createRule('water', [
              'fill-color : ' + v('waterFill'),
              'fill-opacity : ' + areaOpacity,
              'line-style : none'
            ], 'fill'));
          }

          if (checked('wetlandOn')) {
            rules.push(createRule('wetland', [
              'fill-color : ' + v('wetlandFill'),
              'fill-opacity : ' + areaOpacity,
              'line-style : none'
            ], 'fill'));
          }

          if (checked('forestOn')) {
            rules.push(createRule('forest', [
              'fill-color : ' + v('forestFill'),
              'fill-opacity : ' + areaOpacity,
              'line-style : none'
            ], 'fill'));
          }

          if (checked('meadowOn')) {
            rules.push(createRule('meadow', [
              'fill-color : ' + v('meadowFill'),
              'fill-opacity : ' + areaOpacity,
              'line-style : none'
            ], 'fill'));
          }

          if (checked('sandOn')) {
            rules.push(createRule('sand', [
              'fill-color : ' + v('sandFill'),
              'fill-opacity : ' + areaOpacity,
              'line-style : none'
            ], 'fill'));
          }

          if (checked('buildingOn')) {
            rules.push(createRule('building', [
              'fill-color : ' + v('buildingFill'),
              'fill-opacity : ' + areaOpacity,
              'line-color : #ffffff',
              'line-width : 0.2',
              'line-cap : ' + v('lineCap')
            ], 'fill'));
          }

          if (checked('riverOn')) {
            rules.push(createRule('river', [
              'line-color : ' + v('riverColor'),
              'line-width : ' + num('riverWidth', 1.4),
              'line-opacity : ' + riverOpacity,
              'line-cap : ' + v('lineCap')
            ], 'line'));
          }

          if (checked('majorOn')) {
            rules.push(createRule('major_road', [
              'line-color : ' + v('majorColor'),
              'line-width : ' + num('majorWidth', 2.6),
              'line-opacity : 0.95',
              'line-cap : ' + v('lineCap')
            ], 'line'));
          }

          if (checked('minorOn')) {
            rules.push(createRule('minor_road', [
              'line-color : ' + v('minorColor'),
              'line-width : 1.2',
              'line-opacity : 0.9',
              'line-cap : ' + v('lineCap')
            ], 'line'));
          }

          if (checked('pathOn')) {
            rules.push(createRule('path', [
              'line-color : ' + v('pathColor'),
              'line-width : ' + num('pathWidth', 0.8),
              'line-opacity : 0.85',
              'line-style : dash',
              'line-cap : ' + v('lineCap')
            ], 'line'));
          }

          if (checked('railOn')) {
            rules.push(createRule('railway', [
              'line-color : ' + v('railColor'),
              'line-width : 0.8',
              'line-opacity : 0.85',
              'line-style : dash',
              'line-cap : ' + v('lineCap')
            ], 'line'));
          }

          if (checked('placeOn')) {
            rules.push(createRule('place', [
              'text : name',
              'font-family : ' + v('fontName'),
              'font-size : ' + num('fontSize', 14),
              'font-weight : ' + v('fontWeight'),
              'text-color : ' + v('placeColor'),
              'text-halo-color : #ffffff',
              'text-halo-radius : ' + num('textHaloRadius', 2),
              'text-halo-opacity : ' + num('textHaloOpacity', 0.9),
              'text-opacity : ' + num('textOpacity', 1),
              'text-offset : ' + num('labelOffset', 3),
              'text-keep-upright : ' + (checked('keepUpright') ? 'true' : 'false'),
              'text-follow-path : ' + (checked('followPath') ? 'true' : 'false'),
              'text-align-horizontal : center',
              'text-align-vertical : center'
            ], 'text'));
          }

          const output = [...sections, ...rules].join('\n');
          $('#output').value = output;
          $('#manualText').value = output;
          return output;
        }

        function applyManualText() {
          const text = $('#manualText').value.trim();
          if (!text) {
            $('#status').textContent = 'Prázdný text nelze použít.';
            return;
          }
          $('#output').value = text;
          $('#status').textContent = 'Upravený text byl použit jako výsledný .mrules soubor.';
        }

        function copyText() {
          const text = $('#output').value;
          navigator.clipboard.writeText(text).then(() => {
            $('#status').textContent = 'Text byl zkopírován do schránky.';
          }).catch(() => {
            $('#status').textContent = 'Zkopírování se nezdařilo — text můžete zkopírovat ručně.';
          });
        }

        function downloadText() {
          const text = $('#output').value;
          const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'map_style.mrules';
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          $('#status').textContent = 'Soubor .mrules byl stažen.';
        }

        function preset() {
          const preset = {
            background: '#efe6cf',
            sea: '#a9cbd0',
            waterFill: '#7fb7c2',
            wetlandFill: '#9bc7c2',
            riverColor: '#2f8190',
            forestFill: '#889b6d',
            meadowFill: '#d5cf9a',
            sandFill: '#e7d4a2',
            buildingFill: '#6c534a',
            majorColor: '#ba5b36',
            minorColor: '#d39b68',
            pathColor: '#6d5345',
            railColor: '#7b7f8a',
            placeColor: '#302821',
            fontName: 'DejaVu Sans',
            fontSize: 14,
            fontWeight: 'bold',
            labelOffset: 3,
            textHaloRadius: 2,
            textHaloOpacity: 0.9,
            textOpacity: 1,
            areaOpacity: 0.85,
            riverWidth: 1.4,
            riverOpacity: 0.95,
            majorWidth: 2.6,
            pathWidth: 0.8,
            minZoom: 0,
            maxZoom: 22,
            lineCap: 'round'
          };

          Object.entries(preset).forEach(([key, value]) => {
            const input = $(key);
            if (!input) return;
            if (input.type === 'checkbox') {
              input.checked = Boolean(value);
            } else {
              input.value = value;
            }
          });

          ['waterOn', 'wetlandOn', 'riverOn', 'forestOn', 'meadowOn', 'sandOn', 'buildingOn', 'majorOn', 'minorOn', 'pathOn', 'railOn', 'placeOn', 'keepUpright', 'followPath'].forEach((id) => {
            const el = $(id);
            if (el) el.checked = true;
          });

          build();
          $('#status').textContent = 'Předvolba byla aplikována.';
        }

        function setTab(tabName) {
          document.querySelectorAll('.tab').forEach((tab) => {
            tab.classList.toggle('active', tab.dataset.tab === tabName);
          });
          document.querySelectorAll('.tab-panel').forEach((panel) => {
            panel.classList.toggle('active', panel.id === ('panel-' + tabName));
          });
        }

        ['input', 'change'].forEach((eventName) => {
          root.addEventListener(eventName, (e) => {
            if (e.target && e.target.matches('input, select')) {
              build();
              $('#status').textContent = 'Generování aktualizováno.';
            }
          });
        });

        $('#generateBtn').addEventListener('click', () => {
          build();
          $('#status').textContent = '.mrules byl vygenerován.';
        });

        $('#generateFromGuiBtn').addEventListener('click', () => {
          build();
          $('#status').textContent = 'Výstup z GUI byl aktualizován.';
        });

        $('#applyManualBtn').addEventListener('click', applyManualText);
        $('#copyBtn').addEventListener('click', copyText);
        $('#downloadBtn').addEventListener('click', downloadText);
        $('#presetBtn').addEventListener('click', preset);

        document.querySelectorAll('.tab').forEach((tab) => {
          tab.addEventListener('click', () => setTab(tab.dataset.tab));
        });

        build();
      })();
    </script>
  </body>
</html>
