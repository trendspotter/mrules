<html>
<body>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json"></script>
<div id="mrules-studio" class="w-full rounded-2xl border border-slate-300 bg-slate-50 p-4 text-slate-900 shadow-sm dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100">
<style>
#mrules-studio *{box-sizing:border-box}#mrules-studio .grid-main{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:16px}#mrules-studio .panel{border:1px solid #cbd5e1;border-radius:14px;background:#fff;padding:14px}#mrules-studio .row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin:9px 0}#mrules-studio label{font-size:14px}#mrules-studio input[type=color]{width:44px;height:34px;border:0;background:transparent;padding:0}#mrules-studio input[type=number],#mrules-studio input[type=text],#mrules-studio select{width:100%;border:1px solid #94a3b8;border-radius:8px;padding:7px 9px;background:#fff;color:#0f172a}#mrules-studio textarea{width:100%;min-height:520px;resize:vertical;border:1px solid #94a3b8;border-radius:10px;padding:12px;background:#0f172a;color:#dbeafe;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre}#mrules-studio button{border-radius:9px;padding:8px 12px;font-weight:650;cursor:pointer}#mrules-studio .primary{background:#2563eb;color:#fff;border:1px solid #1d4ed8}#mrules-studio .secondary{background:#fff;color:#0f172a;border:1px solid #94a3b8}#mrules-studio button:focus,#mrules-studio input:focus,#mrules-studio select:focus,#mrules-studio textarea:focus{outline:3px solid #93c5fd;outline-offset:2px}#mrules-studio .category{border-top:1px solid #e2e8f0;margin-top:12px;padding-top:10px}#mrules-studio .category:first-of-type{border-top:0;margin-top:0}#mrules-studio .head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}#mrules-studio .actions{display:flex;gap:8px;flex-wrap:wrap}#mrules-studio .small{font-size:12px;color:#64748b}#mrules-studio h2{font-size:20px;font-weight:750;margin:0}#mrules-studio h3{font-size:15px;font-weight:700;margin:0 0 8px}#mrules-studio .status{min-height:20px;font-size:13px;color:#166534;margin-top:7px}@media(max-width:760px){#mrules-studio .grid-main{grid-template-columns:1fr}#mrules-studio textarea{min-height:400px}}@media(prefers-color-scheme:dark){#mrules-studio .panel{background:#111827;border-color:#475569}#mrules-studio input[type=number],#mrules-studio input[type=text],#mrules-studio select{background:#0f172a;color:#f8fafc;border-color:#64748b}#mrules-studio .secondary{background:#1e293b;color:#f8fafc;border-color:#64748b}#mrules-studio .small{color:#94a3b8}#mrules-studio .category{border-color:#334155}#mrules-studio .status{color:#86efac}}
</style>
<div class="head"><div><h2>Maperitive Rules Studio</h2><div class="small">Ukázkovı vizuální generátor základních pravidel .mrules</div></div><div class="actions"><button type="button" class="secondary" id="presetBtn">Vıtvarnı preset</button><button type="button" class="primary" id="copyBtn">Kopírovat pravidla</button></div></div>
<div class="grid-main">
<section class="panel" aria-label="Nastavení stylu">
<h3>Obecné</h3>
<div class="row"><label for="styleName">Název stylu</label><input id="styleName" type="text" value="Krumlov Art Map"></div>
<div class="row"><label for="background">Pozadí mapy</label><input id="background" type="color" value="#f4eedf"></div>
<div class="row"><label for="sea">Barva vody v pozadí</label><input id="sea" type="color" value="#b9d9df"></div>
<div class="category"><h3>Vodstvo</h3>
<div class="row"><label><input id="waterOn" type="checkbox" checked> Zobrazit plochy vody</label><input id="waterFill" type="color" value="#8fcbd4"></div>
<div class="row"><label><input id="riverOn" type="checkbox" checked> Zobrazit øeky a potoky</label><input id="riverColor" type="color" value="#3c91a3"></div>
<div class="row"><label for="riverWidth">Tlouška vodních tokù</label><input id="riverWidth" type="number" min="0.1" max="20" step="0.1" value="1.4"></div></div>
<div class="category"><h3>Krajina</h3>
<div class="row"><label><input id="forestOn" type="checkbox" checked> Lesy</label><input id="forestFill" type="color" value="#9caf83"></div>
<div class="row"><label><input id="meadowOn" type="checkbox" checked> Louky</label><input id="meadowFill" type="color" value="#d8dba8"></div>
<div class="row"><label for="areaOpacity">Krytí ploch</label><input id="areaOpacity" type="number" min="0" max="1" step="0.05" value="0.85"></div></div>
<div class="category"><h3>Cesty</h3>
<div class="row"><label><input id="majorOn" type="checkbox" checked> Hlavní silnice</label><input id="majorColor" type="color" value="#c96b45"></div>
<div class="row"><label for="majorWidth">Tlouška hlavních silnic</label><input id="majorWidth" type="number" min="0.1" max="20" step="0.1" value="2.6"></div>
<div class="row"><label><input id="minorOn" type="checkbox" checked> Vedlejší silnice</label><input id="minorColor" type="color" value="#d8a477"></div>
<div class="row"><label><input id="pathOn" type="checkbox" checked> Pìšiny a stezky</label><input id="pathColor" type="color" value="#775a41"></div>
<div class="row"><label for="pathWidth">Tlouška pìšin</label><input id="pathWidth" type="number" min="0.1" max="10" step="0.1" value="0.8"></div></div>
<div class="category"><h3>Budovy a názvy</h3>
<div class="row"><label><input id="buildingOn" type="checkbox" checked> Budovy</label><input id="buildingFill" type="color" value="#725d55"></div>
<div class="row"><label><input id="placeOn" type="checkbox" checked> Názvy sídel</label><input id="textColor" type="color" value="#302821"></div>
<div class="row"><label for="fontName">Písmo</label><input id="fontName" type="text" value="DejaVu Sans"></div>
<div class="row"><label for="fontSize">Velikost písma</label><input id="fontSize" type="number" min="6" max="80" step="1" value="14"></div></div>
</section>
<section class="panel" aria-label="Vygenerovaná pravidla"><h3>Vıstup .mrules</h3><textarea id="output" spellcheck="false" aria-label="Vygenerovanı soubor Maperitive rules"></textarea><div id="status" class="status" aria-live="polite"></div><p class="small">Ulo jako textovı soubor s pøíponou <strong>.mrules</strong>. Prototyp generuje pøehlednı základ, kterı lze dále ruènì rozšiøovat.</p></section>
</div>
<script>
(()=>{const root=document.getElementById('mrules-studio');if(root.dataset.ready)return;root.dataset.ready='1';const $=id=>root.querySelector('#'+id);const val=id=>$(id).value;const on=id=>$(id).checked;const n=id=>{const x=parseFloat(val(id));return Number.isFinite(x)?x:0};
function rule(target,defs,draw){return ['target : '+target,...defs.map(x=>'\tdefine '+x),'\tdraw : '+draw,''].join('\n')}
function build(){let features=['// Generated by Maperitive Rules Studio','// Style: '+val('styleName').replace(/[\r\n]/g,' '),'','features','\tareas','\t\twater : natural=water OR waterway=riverbank OR landuse=reservoir OR landuse=basin','\t\tforest : natural=wood OR landuse=forest','\t\tmeadow : landuse=meadow OR landuse=grass OR natural=grassland','\t\tbuilding : building','\tlines','\t\triver : waterway=river OR waterway=stream','\t\troad major : highway=motorway OR highway=trunk OR highway=primary OR highway=secondary','\t\troad minor : highway=tertiary OR highway=residential OR highway=unclassified OR highway=service','\t\tpath : highway=footway OR highway=path OR highway=track OR highway=cycleway','\tpoints','\t\tplace : place=city OR place=town OR place=village OR place=hamlet','','properties','\tmap-background-color : '+val('background'),'\tmap-sea-color : '+val('sea'),'','rules',''];let rules=[];if(on('waterOn'))rules.push(rule('water',['fill-color : '+val('waterFill'),'line-style : none'],'fill'));if(on('forestOn'))rules.push(rule('forest',['fill-color : '+val('forestFill'),'fill-opacity : '+n('areaOpacity'),'line-style : none'],'fill'));if(on('meadowOn'))rules.push(rule('meadow',['fill-color : '+val('meadowFill'),'fill-opacity : '+n('areaOpacity'),'line-style : none'],'fill'));if(on('riverOn'))rules.push(rule('river',['line-color : '+val('riverColor'),'line-width : '+n('riverWidth'),'line-end-cap : round'],'line'));if(on('minorOn'))rules.push(rule('road minor',['line-color : '+val('minorColor'),'line-width : 1.2','line-end-cap : round'],'line'));if(on('majorOn'))rules.push(rule('road major',['line-color : '+val('majorColor'),'line-width : '+n('majorWidth'),'line-end-cap : round'],'line'));if(on('pathOn'))rules.push(rule('path',['line-color : '+val('pathColor'),'line-width : '+n('pathWidth'),'line-style : dash','line-end-cap : round'],'line'));if(on('buildingOn'))rules.push(rule('building',['fill-color : '+val('buildingFill'),'line-color : #ffffff','line-width : 0.2'],'fill'));if(on('placeOn'))rules.push(rule('place',['font-family : '+val('fontName').replace(/[\r\n:]/g,' '),'font-size : '+n('fontSize'),'font-weight : bold','text-color : '+val('textColor'),'text-halo-color : #ffffff','text-halo-width : 25%','text : name'],'text'));$('output').value=features.join('\n')+rules.join('\n')}
root.addEventListener('input',build);$('presetBtn').addEventListener('click',()=>{const p={background:'#efe6cf',sea:'#a9cbd0',waterFill:'#7fb7c2',riverColor:'#2f8190',forestFill:'#889b6d',meadowFill:'#d5cf96',majorColor:'#b95538',minorColor:'#d39b6a',pathColor:'#604b38',buildingFill:'#5f504b',textColor:'#29221d'};Object.entries(p).forEach(([k,v])=>$(k).value=v);$('areaOpacity').value='0.78';$('status').textContent='Pouit vıtvarnı preset.';build()});$('copyBtn').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('output').value);$('status').textContent='Pravidla byla zkopírována do schránky.'}catch(e){$('output').select();document.execCommand('copy');$('status').textContent='Pravidla byla oznaèena a zkopírována.'}});build()})();
</script>
</div>
</body>
</html>
